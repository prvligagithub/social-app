
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-v2
  template:
    metadata:
      labels:
        app: social-v2
    spec:
      containers:
        - name: social-app
          image: 24mis0392/social-app:v2
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
